<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071217"/>
      <stop offset="100%" stop-color="#0f252e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0575e6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Crowd Density Concentric Radar Grid -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="250" cy="250" r="120" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Safety Shield Contour -->
  <path d="M 250 85 Q 365 85 365 195 C 365 305 250 400 250 415 C 250 400 135 305 135 195 Q 135 85 250 85 Z" fill="#112933" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Edge Heartbeat / Pulse Waveform Across Shield -->
  <path d="M 160 250 L 210 250 L 230 180 L 250 310 L 270 220 L 290 250 L 340 250" fill="none" stroke="url(#pulseGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Real-Time Crowd Cluster Points -->
  <circle cx="215" cy="160" r="7" fill="#00f5d4" filter="url(#glow)"/>
  <circle cx="285" cy="160" r="7" fill="#00f5d4" filter="url(#glow)"/>
  <circle cx="250" cy="350" r="8" fill="#ffd166" filter="url(#glow)"/>

  <!-- Cryptographic Audit Node (Lock / Key Check) -->
  <circle cx="250" cy="130" r="12" fill="none" stroke="#ffd166" stroke-width="3"/>
  <rect x="242" y="126" width="16" height="14" rx="3" fill="#ffd166"/>
</svg>
